<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العلامة الماسية</title>
<meta name="theme-color" content="#0b1626">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="العلامة الماسية">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1626;--panel:#12233a;--line:#1f3555;--text:#eef3fa;--mute:#8fa3bf;--gold:#2f80ed;--gold2:#7db4ff;--ok:#6fcf97;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;background:var(--bg);color:var(--text);font:400 15px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow:hidden}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative}
header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:700;font-size:20px;color:var(--gold);letter-spacing:.5px}
main{flex:1;overflow-y:auto;padding:0 16px 16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0 8px;font:inherit;font-size:12px;cursor:pointer;position:relative}
nav button b{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--gold)}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--gold);color:#fff;border-radius:9px;font-size:11px;min-width:18px;padding:0 5px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit;margin:4px 0 12px}
.banner{border-radius:16px;padding:22px 20px;min-height:132px;background:linear-gradient(135deg,#17407a,#0e2240 60%);border:1px solid #2a5a9e;display:flex;flex-direction:column;justify-content:center;gap:4px;margin-bottom:14px}
.banner h2{font-size:22px;color:var(--gold2);line-height:1.3}
.banner p{color:var(--mute);font-size:13px}
.dots{display:flex;gap:6px;justify-content:center;margin:-6px 0 14px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.dots i.on{width:18px;background:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
h3{font-size:16px;margin:10px 0 8px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:start;color:inherit;font:inherit;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph{aspect-ratio:3/4;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#21406a,#0f1d31)}
.card .in{padding:10px 12px 12px}
.card .n{font-size:14px;line-height:1.4}
.price{color:var(--gold2);font-weight:700}
.old{color:var(--mute);text-decoration:line-through;font-size:12px;margin-inline-start:6px;font-weight:400}
.rate{color:var(--mute);font-size:12px}
.tag{display:inline-block;background:#16345c;color:var(--gold2);font-size:11px;border-radius:6px;padding:0 6px;margin-bottom:2px}
.btn{width:100%;background:var(--gold);color:#fff;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:none;color:var(--text);border:1px solid var(--line);margin-top:8px}
.btn.wa{background:#1f3d2b;color:#9fe0b6;margin-top:8px}
.btn:disabled{opacity:.4}
.filters{display:flex;gap:8px;margin-bottom:10px}
.filters select{flex:1;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.row{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.row .ph{width:60px;height:60px;font-size:28px;border-radius:10px;flex:none}
.row .g{flex:1}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--text);cursor:pointer;font-size:16px}
.sum{display:flex;justify-content:space-between;padding:6px 0;color:var(--mute)}
.sum.t{color:var(--text);font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--panel);width:100%;max-height:88%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px 22px;border-top:1px solid #2a5a9e}
.sheet .ph{width:62%;margin:0 auto 12px;border-radius:14px}
.sheet h2{font-size:19px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input.f{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font:inherit}
.pay{display:flex;gap:10px;align-items:center;border:1px solid var(--gold);border-radius:12px;padding:12px;margin-top:10px;background:#10294a}
.pay small{color:var(--mute);display:block}
.steps{display:flex;margin:12px 0 4px}
.st{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative}
.st::before{content:"";display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 4px;position:relative;z-index:1}
.st::after{content:"";position:absolute;top:6px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::after{display:none}
.st.done{color:var(--gold2)}.st.done::before,.st.done::after{background:var(--gold)}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--gold);color:#fff;padding:8px 16px;border-radius:20px;font-weight:700;font-size:13px;z-index:9}
.note{font-size:12px;color:var(--mute);margin-top:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}}}
</style>
</head>

{id:6,n:'كريم الجسم XBC 500مل',c:'عناية بالبشرة',p:22,r:4.7,t:'الأكثر مبيعاً'},
{id:7,n:'غسول الوجه الرغوي XBC شاي الشجرة',c:'عناية بالبشرة',p:16,r:4.4},
{id:8,n:'مقشر الوجه XBC شاي الشجرة 250مل',c:'عناية بالبشرة',p:15,r:4.5,t:'وصل حديثاً'},
{id:9,n:'كريم نيفيا 150مل',c:'عناية بالبشرة',p:9,r:4.8},
{id:10,n:'كريم الوجه والجسم Dove Body Love',c:'عناية بالبشرة',p:13,r:4.6},
{id:11,n:'شامبو أطفال Johnson\'s 300مل',c:'أطفال',p:11,r:4.7},
{id:12,n:'بودرة أطفال Johnson\'s 200غ',c:'أطفال',p:8,r:4.6},
{id:13,n:'زيت أطفال Johnson\'s 300مل',c:'أطفال',p:12,r:4.6,t:'وصل حديثاً'},
{id:14,n:'أعواد قطن Johnson\'s 200 عود',c:'أطفال',p:4,r:4.3},
{id:15,n:'شفرات Gillette Venus Miami Sunset (3)',c:'حلاقة',p:10,r:4.4},
{id:16,n:'شفرات Gillette Venus Treasures (3)',c:'حلاقة',p:10,r:4.4},
{id:17,n:'شفرات Gillette Venus 3 Sensitive (3)',c:'حلاقة',p:9,r:4.5,t:'وصل حديثاً'}];
const ph=x=>IMG[x.id]?`<img src="${IMG[x.id]}" alt="${x.n}">`:'';
const BN=[['خصومات الموسم','حتى 20% على مختارات من المنظفات والعناية'],['وصل حديثاً','تشكيلة جديدة من منتجات العناية الشخصية'],['الدفع عند الاستلام','اطلب الآن وادفع عند وصول طلبك']];
const ST=['قيد التجهيز','في الطريق','تم التوصيل'];
let S={tab:'home',cat:'الكل',q:'',price:'0',rate:'0',cart:{},orders:[],sheet:null,b:0,toast:''};
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('ar-LY-u-nu-latn')+' '+CUR;
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(S.cart).reduce((a,[i,q])=>a+P.find(x=>x.id==i).p*q,0);
const SHIP=10;
function toast(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},1400)}
function add(id){S.cart[id]=(S.cart[id]||0)+1;S.sheet=null;toast('أضيف إلى العربة')}
function qty(id,d){S.cart[id]+=d;if(S.cart[id]<=0)delete S.cart[id];render()}
function filtered(){return P.filter(x=>(S.cat=='الكل'||x.c==S.cat)&&x.n.includes(S.q)&&(S.price=='0'||x.p<=+S.price)&&x.r>=+S.rate)}
function card(x){return `<button class="card" onclick="S.sheet={t:'p',id:${x.id}};render()"><div class="ph">${ph(x)}</div><div class="in">${x.t?`<span class="tag">${x.t}</span>`:''}<div class="n">${x.n}</div><div class="price">${fmt(x.p)}${x.o?`<span class="old">${fmt(x.o)}</span>`:''}</div><div class="rate">★ ${x.r}</div></div></button>`}
function chips(){return `<div class="chips">${CATS.map(c=>`<button class="chip ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}</div>`}
function home(){const b=BN[S.b];return `<input class="search" placeholder="ابحث عن منتج" value="${S.q}" oninput="S.q=this.value;S.tab='cat';render(true)">
<div class="banner"><h2>${b[0]}</h2><p>${b[1]}</p></div><div class="dots">${BN.map((_,i)=>`<i class="${i==S.b?'on':''}"></i>`).join('')}</div>
<div class="chips"><button class="chip on" onclick="S.cat='الكل';S.tab='cat';render()">الأكثر مبيعاً</button><button class="chip" onclick="S.cat='الكل';S.tab='cat';render()">وصل حديثاً</button></div>
<h3>الأكثر مبيعاً</h3><div class="grid">${P.filter(x=>x.t=='الأكثر مبيعاً').map(card).join('')}</div>
<h3>وصل حديثاً</h3><div class="grid">${P.filter(x=>x.t=='وصل حديثاً').map(card).join('')}</div>`}
function cat(){const l=filtered();return `<input class="search" placeholder="ابحث عن منتج" value="${S.q}" oninput="S.q=this.value;render(true)">${chips()}
<div class="filters"><select onchange="S.price=this.value;render()"><option value="0">كل الأسعار</option><option value="10" ${S.price=='10'?'selected':''}>حتى 10</option><option value="20" ${S.price=='20'?'selected':''}>حتى 20</option></select>
<select onchange="S.rate=this.value;render()"><option value="0">كل التقييمات</option><option value="4.5" ${S.rate=='4.5'?'selected':''}>4.5 فأكثر</option></select></div>
${l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<div class="empty">لا توجد نتائج. جرّب تغيير الفلاتر أو كلمة البحث.</div>'}`}
function cart(){const ids=Object.keys(S.cart);if(!ids.length)return '<div class="empty">العربة فارغة. تصفح التصنيفات وأضف منتجك الأول.</div>';
return ids.map(i=>{const x=P.find(p=>p.id==i);return `<div class="row"><div class="ph">${ph(x)}</div><div class="g"><div>${x.n}</div><div class="price">${fmt(x.p)}</div></div><div class="qty"><button onclick="qty(${i},1)" aria-label="زيادة">+</button>${S.cart[i]}<button onclick="qty(${i},-1)" aria-label="إنقاص">−</button></div></div>`}).join('')+
`<div class="sum"><span>المنتجات</span><span>${fmt(total())}</span></div><div class="sum"><span>التوصيل</span><span>${fmt(SHIP)}</span></div><div class="sum t"><span>الإجمالي</span><span>${fmt(total()+SHIP)}</span></div>
<button class="btn" onclick="S.sheet={t:'co',step:0};render()">إتمام الطلب</button>`}
function track(o){return `<div class="steps">${ST.map((s,i)=>`<div class="st ${i<=o.s?'done':''}">${s}</div>`).join('')}</div>`}
function me(){return `<h3>طلباتي</h3>`+(S.orders.length?S.orders.map(o=>`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>طلب #${o.id}</b><span class="price">${fmt(o.t)}</span></div><div class="rate">${o.n}</div>${track(o)}
${o.s<2?`<button class="btn alt" onclick="adv(${o.id})">محاكاة: تحديث الحالة</button>`:`<button class="btn alt" onclick="toast('تم إرسال طلب الإرجاع')">طلب إرجاع أو استبدال</button>`}</div>`).join(''):'<div class="empty">لا توجد طلبات بعد. ستظهر هنا مع تتبع كل خطوة.</div>')+
`<h3>عناوين الشحن</h3><div class="row"><div class="g">${S.addr||'لم يحفظ عنوان بعد. سيحفظ مع أول طلب.'}</div></div>
<h3>سياسة الإرجاع</h3><div class="note">يمكنك طلب الإرجاع أو الاستبدال خلال 7 أيام من الاستلام، بشرط أن يكون المنتج بحالته الأصلية.</div>`}
function adv(id){const o=S.orders.find(o=>o.id==id);o.s++;render()}
function sheet(){const s=S.sheet;if(!s)return '';
if(s.t=='p'){const x=P.find(p=>p.id==s.id);const m=encodeURIComponent('مرحباً، أريد طلب: '+x.n);
return `<div class="ph">${ph(x)}</div><h2>${x.n}</h2><div class="rate">★ ${x.r} · ${x.c}</div><div class="price" style="font-size:20px;margin:8px 0">${fmt(x.p)}${x.o?`<span class="old">${fmt(x.o)}</span>`:''}</div>
<button class="btn" onclick="add(${x.id})">أضف إلى العربة</button><a href="https://wa.me/${WA}?text=${m}" target="_blank" rel="noopener" style="text-decoration:none"><button class="btn wa">اطلب عبر واتساب</button></a>`}
if(s.t=='co'){if(s.step==0)return `<h2>بيانات التوصيل</h2><label>الاسم</label><input class="f" id="nm"><label>رقم الهاتف</label><input class="f" id="ph" inputmode="tel" placeholder="09xxxxxxxx"><label>العنوان</label><input class="f" id="ad">
<div class="pay"><span>💵</span><div><b>الدفع عند الاستلام</b><small>تدفع عند وصول الطلب</small></div></div><div class="note">الدفع الإلكتروني يضاف في المرحلة الثانية.</div><button class="btn" style="margin-top:14px" onclick="toOtp()">متابعة</button>`;
return `<h2>تأكيد رقم الهاتف</h2><p class="note">أرسلنا رمزاً من 4 أرقام إلى ${s.ph}. في هذا النموذج الرمز هو 1234.</p><label>الرمز</label><input class="f" id="otp" inputmode="numeric" maxlength="4"><div class="note" id="err" style="color:#e57373"></div><button class="btn" style="margin-top:14px" onclick="confirmO()">تأكيد الطلب</button>`}
if(s.t=='ok')return `<div class="empty"><div style="font-size:48px">✅</div><h2 style="color:var(--text)">تم استلام طلبك #${s.id}</h2><p>سنتصل بك لتأكيد الطلب. تابع حالته من حسابي.</p></div><button class="btn" onclick="S.sheet=null;S.tab='me';render()">تتبع الطلب</button>`}
function toOtp(){const nm=$('#nm').value.trim(),ph=$('#ph').value.trim(),ad=$('#ad').value.trim();if(!nm||ph.length<9||!ad){toast('أكمل كل الحقول');return}S.sheet={t:'co',step:1,ph,ad,nm};render()}
function confirmO(){if($('#otp').value!='1234'){$('#err').textContent='الرمز غير صحيح. أعد المحاولة.';return}
const id=1000+S.orders.length+1;S.orders.unshift({id,t:total()+SHIP,s:0,n:Object.entries(S.cart).map(([i,q])=>P.find(p=>p.id==i).n+' × '+q).join('، ')});S.addr=S.sheet.ad;S.cart={};S.sheet={t:'ok',id};render()}
function render(keep){const ae=document.activeElement;const pos=ae&&ae.selectionStart;
const T=[['home','🏠','الرئيسية'],['cat','◈','التصنيفات'],['cart','🛍️','العربة'],['me','👤','حسابي']];
$('#app').innerHTML=`<header><span class="logo">◆ العلامة الماسية</span></header><main>${{home,cat,cart,me}[S.tab]()}</main>
<nav>${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()"><b>${t[1]}</b>${t[2]}${t[0]=='cart'&&cnt()?`<span class="badge">${cnt()}</span>`:''}</button>`).join('')}</nav>
${S.sheet?`<div class="sheet-bg" onclick="if(event.target==this){S.sheet=null;render()}"><div class="sheet">${sheet()}</div></div>`:''}${S.toast?`<div class="toast">${S.toast}</div>`:''}`;
if(keep){const i=$('.search');if(i){i.focus();i.setSelectionRange(pos||i.value.length,pos||i.value.length)}}}
setInterval(()=>{if(S.tab=='home'&&!S.sheet){S.b=(S.b+1)%BN.length;render()}},4000);
render();
</script>
</body>
</html>
